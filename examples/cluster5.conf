# Five local nodes, 12 partitions, 3 replicas each. Consistent hashing
# spreads the 36 partition replicas across the nodes, so each node hosts a
# subset of the partitions rather than all of them.
partitions 12
replication 3
vnodes 64
node 1 127.0.0.1:7101
node 2 127.0.0.1:7102
node 3 127.0.0.1:7103
node 4 127.0.0.1:7104
node 5 127.0.0.1:7105
